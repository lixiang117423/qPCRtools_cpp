name: CI (tests)

# 每次提交都验证核心算法与测试，早发现问题。与发版构建 build.yml 分离：
# 这里只构建 qpcr_core + 测试（依赖 Qt6::Core，不需要 WebEngine/Widgets），更快。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许 Actions 页面手动触发（首次启用 Actions 后可直接跑一次验证）

env:
  QT_VERSION: '6.7.3'

jobs:
  test:
    name: Build & run tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        # 只构建 qpcr_core + 测试（QPCRTOOLS_BUILD_APP=OFF），无需 WebEngine 等 GUI 模块

    - name: Install dependencies
      # gsl 提供精确 t/F 分布（无 GSL 时回退到内置不完全 Beta，结果一致）
      run: brew install eigen gsl ninja

    - name: Configure (BUILD_TESTS=ON)
      # 2026-10-13 目录整理：CMake 工程位于 code/，构建目录仍在仓库根
      run: |
        cmake -S code -B build \
          -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -DQPCRTOOLS_BUILD_APP=OFF \
          -GNinja

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

    - name: Run front-end smoke test (jsdom)
      # app.js 的 jsdom 冒烟安全网（2026-10-15 起纳入 CI）：断言关键函数存在、
      # initializeUI 无未捕获异常，并校验"分析记录"文本生成。
      working-directory: code/tests/js
      run: |
        npm ci --no-audit --no-fund
        node smoke.test.js
