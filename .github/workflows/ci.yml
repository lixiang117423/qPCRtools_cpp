name: CI (tests)

# 每次提交都验证核心算法与测试，早发现问题。与发版构建 build.yml 分离：
# 这里只构建 qpcr_core + 测试（依赖 Qt6::Core，不需要 WebEngine/Widgets），更快。
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:   # 允许 Actions 页面手动触发（首次启用 Actions 后可直接跑一次验证）

env:
  # 6.5.3 在 macos-latest (arm64) 上不含 WebEngine 模块，configure 直接失败；
  # 与 build.yml 对齐用 6.7.3 + 显式安装 WebEngine/WebChannel。
  QT_VERSION: '6.7.3'
  QT_MODULES: 'qtwebengine qtwebchannel'

jobs:
  test:
    name: Build & run tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        modules: ${{ env.QT_MODULES }}

    - name: Install dependencies
      # gsl 提供精确 t/F 分布（无 GSL 时回退到内置不完全 Beta，结果一致）
      run: brew install eigen gsl ninja

    - name: Configure (BUILD_TESTS=ON)
      run: |
        cmake -B build \
          -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_TESTS=ON \
          -GNinja

    - name: Build
      run: cmake --build build

    - name: Run tests
      run: ctest --test-dir build --output-on-failure
