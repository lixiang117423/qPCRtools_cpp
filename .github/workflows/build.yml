name: Build qPCRtools

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.7.3'
  QT_MODULES: 'qtwebengine qtwebchannel qtpositioning'

jobs:
  build-windows:
    name: Build Windows (EXE)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        cache: true
        modules: ${{ env.QT_MODULES }}

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Install dependencies
      run: |
        C:\vcpkg\vcpkg install eigen3:x64-windows gsl:x64-windows --classic

    - name: Configure CMake
      # 2026-10-13 目录整理：CMake 工程位于 code/，构建目录仍在仓库根
      run: |
        cmake -S code -B build `
          -DCMAKE_PREFIX_PATH="$env:Qt6_DIR" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" `
          -DCMAKE_CXX_STANDARD=17

    - name: Build
      run: cmake --build build --config Release

    - name: Deploy Windows
      shell: pwsh
      run: |
        $version = "${{ github.ref_name }}" -replace '^v', ''
        $version = $version -replace '[^0-9A-Za-z._-]', '-'

        # 使用 windeployqt 收集依赖（Qt6 会自动检测 WebEngine）
        & "$env:Qt6_DIR/bin/windeployqt.exe" build/Release/qPCRtools.exe --release --no-translations

        # 复制 web 资源（源码侧在 code/web）
        New-Item -ItemType Directory -Force -Path build/Release/web
        Copy-Item -Path code/web/* -Destination build/Release/web -Recurse -Force

        # 复制示例数据文件
        New-Item -ItemType Directory -Force -Path build/Release/examples
        Copy-Item -Path code/examples/*.csv -Destination build/Release/examples -Force

        # 创建发布目录
        New-Item -ItemType Directory -Force -Path release
        Copy-Item -Path build/Release/* -Destination release -Recurse -Force

        # 压缩为版本化 ZIP
        Compress-Archive -Path release/* -DestinationPath "qPCRtools-$version-windows.zip"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qPCRtools-windows
        path: qPCRtools-*-windows.zip
        retention-days: 30
        if-no-files-found: error

  build-macos:
    name: Build macOS (DMG)
    # 2026-10-15：改用 macos-14。macos-latest（macOS 15 + Xcode 26 SDK）里 Apple 已移除
    # 老旧的 AGL 框架，而 Qt 6.7.3 的 CMake 仍然 `-framework AGL`，链接阶段直接
    # `ld: framework 'AGL' not found` 而失败（v1.2.0 首次打 tag 实测）。macos-14 的
    # SDK 仍有 AGL，可正常出包；升级 Qt 到不再引用 AGL 的版本后可换回 macos-latest。
    runs-on: macos-14
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        cache: true
        modules: ${{ env.QT_MODULES }}

    - name: Install dependencies
      run: |
        brew install eigen gsl ninja

    - name: Configure CMake
      # 2026-10-13 目录整理：CMake 工程位于 code/，构建目录仍在仓库根
      run: |
        cmake -S code -B build \
          -DCMAKE_PREFIX_PATH="$Qt6_DIR" \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_CXX_STANDARD=17 \
          -GNinja

    - name: Build
      run: |
        cmake --build build
        echo "Build exit code: $?"

    - name: Find app bundle
      run: |
        echo "=== build directory structure ==="
        find build -type f -name "*.app" -o -type d -name "*.app" | head -20
        ls -la build/

    - name: Deploy macOS
      run: |
        VERSION="$(printf '%s' "$GITHUB_REF_NAME" | sed 's/^v//; s/[^0-9A-Za-z._-]/-/g')"
        DMG_NAME="qPCRtools-${VERSION}-macOS.dmg"

        # 找到 app 实际位置
        APP_PATH=$(find build -name "qPCRtools.app" -type d | head -1)

        # 检查是否找到 app
        if [ -z "$APP_PATH" ]; then
          echo "❌ ERROR: qPCRtools.app not found!"
          echo "=== All files in build directory ==="
          find build -type f | head -30
          exit 1
        fi

        echo "✅ Found app at: $APP_PATH"

        # 先复制 web 资源（在 macdeployqt 之前；源码侧在 code/web）
        mkdir -p "$APP_PATH/Contents/Resources/web"
        cp -R code/web/* "$APP_PATH/Contents/Resources/web/"

        # 复制示例数据文件
        mkdir -p "$APP_PATH/Contents/Resources/examples"
        cp code/examples/*.csv "$APP_PATH/Contents/Resources/examples/"

        # 使用 macdeployqt 收集依赖
        $Qt6_DIR/bin/macdeployqt "$APP_PATH" -no-strip

        # 对应用进行临时签名（ad-hoc signing）
        codesign --force --deep --sign - "$APP_PATH"

        # 手动创建 DMG
        mkdir -p dmg_temp
        cp -R "$APP_PATH" dmg_temp/
        ln -s /Applications dmg_temp/Applications

        hdiutil create -volname "qPCRtools" \
          -srcfolder dmg_temp \
          -ov -format UDZO \
          -imagekey zlib-level=9 \
          "$DMG_NAME"

        # 清理
        rm -rf dmg_temp

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qPCRtools-macos
        path: qPCRtools-*-macOS.dmg
        retention-days: 30
        if-no-files-found: error

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
    - name: Download release assets
      uses: actions/download-artifact@v4
      with:
        path: release-assets
        pattern: qPCRtools-*
        merge-multiple: true

    - name: List release assets
      run: ls -lh release-assets

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/*
        draft: false
        prerelease: false
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
